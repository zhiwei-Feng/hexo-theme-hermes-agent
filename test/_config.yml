title: Hermes Theme Fixture
subtitle: "Tech · AI · Life"
description: "Fixture blog for hexo-theme-hermes-agent development."
author: "Test Author"
language: en
timezone: ""

url: http://localhost:4000
permalink: :year/:month/:day/:title/

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang

default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''

date_format: YYYY-MM-DD
time_format: HH:mm:ss

per_page: 10
pagination_dir: page

theme: hermes-agent

# Code block rendering: the theme's filter re-wraps <pre> with a .code-block
# container and a COPY button, so the gutter column is redundant. Turning off
# line_number here also skips generating the markup Hexo would otherwise emit
# just for the filter to throw away.
highlight:
  line_number: false

# Search index generation
search:
  path: search.json
  field: post
  format: json
  limit: 10000
