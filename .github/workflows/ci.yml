name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install lint deps
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Run stylelint
        run: npm run lint:css
